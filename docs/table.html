<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlemap</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="dm.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #1a1714; }
  #tbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: rgba(20,16,12,.85); color: #eee; }
  #tbar b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tbar button { padding: 6px 12px; }
  #board { position: fixed; top: 46px; left: 0; right: 0; bottom: 0; overflow: auto; border: none; border-radius: 0; max-height: none; }
  #status { font-size: 12px; white-space: nowrap; }
  #wait { color: #ddd; text-align: center; padding: 80px 20px; font-size: 18px; }
  .lbadge { position: absolute; top: -2px; right: -2px; background: #e03131; color: #fff; border-radius: 10px; font-size: 11px; padding: 0 5px; }
  #lootwin, #joinwin { position: fixed; z-index: 40; left: 0; right: 0; top: 46px; bottom: 0; overflow: auto; background: rgba(10,8,6,.55); padding: 12px; }
  #lootwin.hidden, #joinwin.hidden, .lbadge.hidden { display: none; }
  .lw { max-width: 560px; margin: 0 auto 14px; background: var(--panel); color: var(--ink); border-radius: 14px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .lw h3 { margin: 0 0 6px; }
  .li { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 6px 0; }
  .li-h { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .li-h img.it { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .li-d { margin-top: 6px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .av { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; overflow: hidden; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av.ok::after { content: "✓"; position: absolute; }
  .members { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .mem { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px 2px 2px; border-radius: 16px; background: var(--chip); }
  .mem.ok { background: #d3f9d8; color: #1b4d2b; }
  .curse { background: #ffe3e3; color: #7a1010; border-radius: 8px; padding: 6px 8px; margin-top: 6px; }
  .rar { color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; display: inline-block; cursor: pointer; border: 3px solid transparent; }
  .swatch.on { border-color: #000; }
</style>
</head>
<body>
<div id="tbar"><b id="tname">Battlemap</b><span id="status">connecting…</span><button id="lootbtn" class="ghost" style="color:#fff;position:relative" title="Loot &amp; items from the DM">🎁<span id="lootbadge" class="lbadge hidden"></span></button><button id="mebtn" class="ghost" style="color:#fff;padding:4px 8px" title="Your name and picture"></button><button class="ghost" id="zout" style="color:#fff">−</button><button class="ghost" id="zfit" style="color:#fff">Fit</button><button class="ghost" id="zin" style="color:#fff">+</button></div>
<div id="lootwin" class="hidden"></div><div id="joinwin" class="hidden"></div>
<div id="board" class="mapbox"><div id="wait">Waiting for the DM to share a map…</div></div>
<script>
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
</script>
<script src="config.js"></script>
<script src="mapview.js"></script>
<script src="table.js"></script>
</body>
</html>
